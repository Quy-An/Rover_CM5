services:
  rover_app:
    build: .
    container_name: rover_running_container
    restart: always
    network_mode: host
    privileged: true
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      memlock: -1
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /home/pi/calib_mpu9250.json:/home/pi/calib_mpu9250.json:ro